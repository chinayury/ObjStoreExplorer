name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-web.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .

      - name: Run smoke tests
        env:
          TZ: Asia/Shanghai
        run: python -m pytest -v

      - name: Build wheel and sdist
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          python -m pip install "build>=1.2,<2.0"
          # 不能在本项目根目录跑 `python -m build`: 根目录的 build.py 会遮蔽 build 包
          python -m build "$GITHUB_WORKSPACE" --outdir "$GITHUB_WORKSPACE/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  docker:
    name: Docker build & health check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t objstoreexplorer:ci .

      - name: Run container and verify /api/health
        run: |
          docker run -d --name ose-ci -p 18083:8000 \
            -e WEB_ADMIN_PASSWORD=ci-test-pass \
            objstoreexplorer:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18083/api/health; then
              ok=1
              break
            fi
            sleep 2
          done
          echo
          docker logs ose-ci | tail -50
          test "$ok" = "1"

      - name: Cleanup container
        if: always()
        run: docker rm -f ose-ci || true
